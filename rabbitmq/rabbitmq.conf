# There is no plaintext AMQP listener: the only way in is AMQP over TLS on 5671, so every
# demonstration exercises the certificate check.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca-cert.pem
ssl_options.certfile   = /etc/rabbitmq/certs/broker-cert.pem
ssl_options.keyfile    = /etc/rabbitmq/certs/broker-key.pem

# The lab is about the client checking the broker's identity, not the other way round, so
# the broker asks for no client certificate.
ssl_options.verify               = verify_none
ssl_options.fail_if_no_peer_cert = false

# Connections arrive from the proxy rather than from the loopback interface, so the default
# guest user has to be allowed to authenticate from elsewhere.
loopback_users = none

management.tcp.port = 15672

log.console = true
log.console.level = info
