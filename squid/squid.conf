# A deliberately narrow proxy. The only thing it will do is open a CONNECT tunnel to the
# broker's TLS port; everything else is refused. An application on this network therefore
# has no way to reach the broker except through a tunnel established before AMQP starts,
# which is the whole situation the transport seam exists for.
#
# This file replaces the one shipped in the image, so the ACLs it relies on are defined
# here rather than inherited.

http_port 3128

acl CONNECT method CONNECT
acl broker dstdomain broker-a broker-b
acl broker_tls_port port 5671

http_access allow CONNECT broker broker_tls_port
http_access deny all

# Nothing here is cacheable, and a CONNECT tunnel is opaque anyway.
cache deny all

# Do not rewrite or announce anything about the client.
via off
forwarded_for delete

# Logging stays at the image default, /var/log/squid/access.log, because squid drops to an
# unprivileged user and cannot write to the container's stdout. To watch the tunnels:
#   docker compose exec proxy tail -f /var/log/squid/access.log
